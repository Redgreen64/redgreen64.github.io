<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.gif" type="image/gif">
  <link rel="stylesheet" href="background.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      font-family: 'Chakra Petch', sans-serif;
      text-align: center;
    }

    .error-container {
      background: rgba(0, 0, 0, 0.7);
      padding: 60px 40px;
      border-radius: 10px;
      border: 3px solid #667eea;
      box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
      max-width: 600px;
    }

    .error-code {
      font-size: 120px;
      font-weight: 700;
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      animation: float 3s ease-in-out infinite;
    }

    .error-title {
      font-size: 48px;
      color: #fff;
      margin: 20px 0;
      font-weight: 700;
    }

    .error-message {
      font-size: 18px;
      color: #d4d4d4;
      margin: 20px 0 40px 0;
      line-height: 1.6;
    }

    .error-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      border: 2px solid;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      font-family: 'Chakra Petch', sans-serif;
    }

    .btn-home {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border-color: #667eea;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-back {
      background: transparent;
      color: #667eea;
      border-color: #667eea;
    }

    .btn-back:hover {
      background: rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 40px;
      background-color: #667eea;
      margin-left: 5px;
      animation: blink 1s infinite;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Page Not Found<span class="cursor"></span></h2>
    <p class="error-message">
      Oops! The page you're looking for doesn't exist. It might have been moved, deleted, or you may have mistyped the URL.
    </p>
    <div class="error-buttons">
      <a href="/" class="btn btn-home">← Go Home</a>
      <button class="btn btn-back" onclick="history.back()">← Go Back</button>
    </div>
  </div>
</body>
</html>
