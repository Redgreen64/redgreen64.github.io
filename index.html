<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="background.css">
    <title>PersonalWebsite.htm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      .ticker-container {
        background-color: #222;
        padding: 0;
        margin: 20px 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        font-family: Arial, sans-serif;
        height: 30px;
      }
      
      .ticker-label {
        background-color: #cc0000;
        color: white;
        padding: 5px 10px;
        font-weight: bold;
        font-size: 12px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      
      .ticker-content {
        flex: 1;
        overflow: hidden;
        position: relative;
      }
      
      .ticker-text {
        color: white;
        font-size: 14px;
        padding: 5px 0;
        white-space: nowrap;
        animation: scroll-left 30s linear infinite;
        display: inline-block;
      }
      
      .ticker-content:hover .ticker-text {
        animation-play-state: paused;
      }
      
      @keyframes scroll-left {
        0% {
          transform: translateX(100%);
        }
        100% {
          transform: translateX(-100%);
        }
      }
      
      .ticker-separator {
        color: #cc0000;
        margin: 0 10px;
      }
    </style>
  </head>
  <body style="background-color:rgba(148, 165, 74, 0.541);">
    <div class="ticker-container">
      <div class="ticker-label">LATEST</div>
      <div class="ticker-content">
        <div class="ticker-text" id="ticker-text">Loading news...</div>
      </div>
    </div>

    <h1>Hello, There.</h1>
    <hr>
    <br>
    <hr>
    <b>Some Install Scripts (Linux)</b>
    <p>Install <span class="NONAME">UNIDENTIFIED</span></p>
    <code>
      curl -fsSL https://redgreen64.github.io/installer/install.sh | sh 
    </code>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      // Fetch BBC News RSS feed
      async function loadNewsTicker() {
        try {
          // Using a CORS proxy since BBC RSS might have CORS restrictions
          const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=http://feeds.bbc.co.uk/news/rss.xml');
          const data = await response.json();
          
          if (data.items && data.items.length > 0) {
            // Get first 10 items and extract titles
            const newsItems = data.items.slice(0, 10).map(item => item.title);
            const tickerText = newsItems.join(' • ');
            
            document.getElementById('ticker-text').textContent = tickerText;
          }
        } catch (error) {
          console.error('Error loading news feed:', error);
          document.getElementById('ticker-text').textContent = 'Unable to load news feed. Please check back later.';
        }
      }
      
      // Load news when page loads
      window.addEventListener('DOMContentLoaded', loadNewsTicker);
    </script>
  </body>
</html>
